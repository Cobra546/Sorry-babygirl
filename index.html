<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#100d18">
<title>Sorry, Babygirl 💜</title>
<style>
:root{--ink:#292033}*{box-sizing:border-box}body{margin:0;min-height:100svh;color:#fff;font-family:Georgia,serif;background:radial-gradient(ellipse at 50% 38%,#342343 0%,#1a1424 42%,#100d18 78%);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px}
body:before,body:after{content:"✦";position:fixed;color:#d9c5ff55;font-size:28px;animation:float 6s ease-in-out infinite;pointer-events:none}body:before{top:12%;left:12%}body:after{right:13%;bottom:14%;animation-delay:-3s}@keyframes float{50%{transform:translateY(-16px) rotate(18deg);opacity:.45}}
.wrap{width:min(100%,520px);text-align:center;position:relative;z-index:1}.eyebrow{letter-spacing:.28em;text-transform:uppercase;font:10px Arial,sans-serif;color:#d4bfff;margin-bottom:12px}h1{font-size:clamp(32px,8vw,48px);font-weight:normal;margin:0 0 9px;color:#fff1fa;text-shadow:0 3px 24px #c29cff44}.sub{font:13px Arial,sans-serif;color:#c9bbd6;margin:0 0 22px}
.deck{height:370px;position:relative;margin:0 auto 20px;width:min(100%,350px);touch-action:pan-y}.card{position:absolute;inset:0;border:1px solid #ffffff55;border-radius:22px;padding:28px 25px 24px;background:linear-gradient(145deg,#fff9ff,#f2e6ff 65%,#e8d8f5);color:var(--ink);box-shadow:0 18px 55px #0008;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .48s cubic-bezier(.2,.8,.2,1),opacity .42s;overflow:hidden}.card:before{content:"";position:absolute;inset:10px;border:1px solid #b79bc966;border-radius:15px;pointer-events:none}.card:after{content:"♡";position:absolute;top:18px;right:25px;color:#bd8fb7;font-size:24px}.card .number{font:10px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#907a9e;margin-bottom:22px}.card .message{font-size:clamp(24px,6vw,31px);line-height:1.3;max-width:270px}.card .tap{font:10px Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:#8b7894;margin-top:30px}.card .ornament{font-size:22px;color:#b48aa9;margin-top:16px}.card.back{cursor:default}.card.out{transform:translateX(-125%) rotate(-13deg)!important;opacity:0;pointer-events:none}.card.active{z-index:5}
.progress{font:11px Arial,sans-serif;letter-spacing:.12em;color:#d4c4e1;margin-bottom:10px}.track{height:3px;background:#ffffff20;border-radius:9px;overflow:hidden;width:180px;margin:0 auto 15px}.track span{display:block;height:100%;background:linear-gradient(90deg,#b99bff,#f3c8df);width:0;transition:width .3s}.hint{font:12px Arial,sans-serif;color:#b9a9c6}.controls{display:flex;justify-content:center;gap:10px;margin-top:17px}button{border:1px solid #ffffff3b;background:#ffffff10;color:#f7eefe;padding:10px 17px;border-radius:999px;font:12px Arial,sans-serif;cursor:pointer}button:active{transform:scale(.96)}button:disabled{opacity:.3;cursor:default}.done{display:none;color:#f7eefe;font-size:25px;line-height:1.5;padding:42px 22px;margin:0 auto 16px;max-width:350px;min-height:220px;border:1px solid #ffffff55;border-radius:22px;background:linear-gradient(145deg,#fff9ff18,#d9c2ff12);box-shadow:0 18px 45px #0005}.done.show{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.done .final-heart{font-size:34px;color:#e8c9ff}.done .final-note{font:13px/1.7 Arial,sans-serif;color:#d9c9e8}
@media(max-height:700px){.deck{height:320px}.card{padding:20px}.sub{margin-bottom:14px}h1{font-size:34px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><main class="wrap">
<div class="eyebrow">a little something from me</div><h1>I'm Sorry, Babygirl 💜</h1><p class="sub">60 little cards, each carrying an apology.</p>
<section class="deck" id="deck" aria-label="Apology flashcards"></section>
<div class="progress" id="progress">01 / 60</div><div class="track"><span id="bar"></span></div><div class="hint" id="hint">Tap the top card to send it away ✨</div>
<div class="done" id="done"><div class="final-heart">♡ ✨ ♡</div><div>That’s all 60…</div><div class="final-note">I hope you know I truly mean every apology.<br>Whenever you’re ready, I’m here to listen. 💜</div></div>
<div class="controls"><button id="undo" disabled>↶ Previous</button><button id="next">Next card →</button></div></main>
<script>
const messages=Array.from({length:60},(_,i)=>["Sorry","Naww","Please","Babygirl","Ab nhi hoga","Maaf karden","Sharif bacha hun main","Aisa zulum tw na karen","Kya Hoga mera agar aap baat nhi karengi tw","Mera kya hoga aapsy begair baat kary"][i%10]);
let index=0,history=[];const deck=document.getElementById('deck'),progress=document.getElementById('progress'),bar=document.getElementById('bar'),hint=document.getElementById('hint'),done=document.getElementById('done'),undo=document.getElementById('undo'),next=document.getElementById('next');
function render(){deck.innerHTML='';if(index>=messages.length){deck.innerHTML='';done.classList.add('show');progress.textContent='60 / 60';bar.style.width='100%';hint.textContent='You made it to the final card ✨';next.disabled=true;undo.disabled=!history.length;return}done.classList.remove('show');next.disabled=false;
for(let offset=3;offset>=0;offset--){let n=index+offset;if(n>=messages.length)continue;let card=document.createElement('article');card.className='card '+(offset===0?'active':'back');card.style.zIndex=5-offset;card.style.transform=offset===0?'translate(0,0) rotate(0deg)':'translate('+(offset*3)+'px,'+(offset*7)+'px) scale('+(1-offset*.035)+')';card.style.opacity=1-offset*.13;
if(offset===0){card.innerHTML='<div class="number">A little apology · '+String(index+1).padStart(2,'0')+'</div><div class="message">'+messages[n]+'</div><div class="ornament">✧ ♡ ✧</div><div class="tap">tap to continue</div>';card.addEventListener('click',advance)}else{card.innerHTML='<div class="number">NEXT · '+String(n+1).padStart(2,'0')+'</div><div class="message" style="font-size:20px;color:#8d7b98">♡</div>';card.setAttribute('aria-hidden','true')}deck.appendChild(card)}
progress.textContent=String(index+1).padStart(2,'0')+' / 60';bar.style.width=(index/60*100)+'%';undo.disabled=!history.length}
function advance(){if(index>=messages.length)return;let top=deck.querySelector('.active');if(top){top.classList.add('out');setTimeout(()=>{history.push(index);index++;render()},260)}}
function goBack(){if(!history.length)return;index=history.pop();render()}next.addEventListener('click',advance);undo.addEventListener('click',goBack);let startX=0;deck.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});deck.addEventListener('touchend',e=>{if(startX-e.changedTouches[0].screenX>55)advance()},{passive:true});render();
</script></body></html>
